# ── Onesimus — nginx reverse-proxy configuration ─────────────────────────────
#
# Install:
#   sudo cp onesimus.nginx.conf /etc/nginx/sites-available/onesimus
#   sudo ln -s /etc/nginx/sites-available/onesimus /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates (Let's Encrypt):
#   sudo certbot --nginx -d onesimus.example.com
#
# Requires nginx >= 1.25.1 for "http2 on;" directive.
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstream: Daphne ASGI server ──────────────────────────────────────────────
upstream daphne {
    server 127.0.0.1:8888;
    keepalive 32;
}

# ── Logging formats ───────────────────────────────────────────────────────────
log_format onesimus_main
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time ut=$upstream_response_time';

log_format onesimus_ws
    '$remote_addr [$time_local] WS "$uri" $status '
    'rt=$request_time';

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name onesimus.example.com;

    access_log  /var/log/nginx/onesimus-access.log onesimus_main;
    error_log   /var/log/nginx/onesimus-error.log  warn;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;                              # nginx >= 1.25.1 syntax
    server_name onesimus.example.com;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/onesimus-access.log onesimus_main;
    error_log   /var/log/nginx/onesimus-error.log  warn;

    # ── SSL certificates (managed by certbot) ─────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/onesimus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onesimus.example.com/privkey.pem;

    # ── Modern TLS settings ───────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           SAMEORIGIN                                     always;
    add_header X-Content-Type-Options    nosniff                                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # ── Static files (served directly, no Django involved) ────────────────────
    location /static/ {
        alias   /srv/onesimus-web/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── WebSocket connections (/ws/) ──────────────────────────────────────────
    location /ws/ {
        proxy_pass          http://daphne;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;    # keep WS connections alive
        proxy_send_timeout  3600s;

        access_log /var/log/nginx/onesimus-ws.log onesimus_ws;
    }

    # ── All other requests → Daphne ───────────────────────────────────────────
    location / {
        proxy_pass          http://daphne;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";   # disable keep-alive passthrough

        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        client_max_body_size   20M;
    }
}
